<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firefly AI Assistant (Full Auto)</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <h1>Firefly AI Assistant</h1>
    <p id="status-text">Cargando datos de Firefly III...</p>
    <button id="btn-config" class="icon-button">⚙️</button>
  </div>
  <div class="chat-messages" id="chat">
    <div class="message bot">¡Hola! Sincronicé tus cuentas, categorías y etiquetas. Decime tu gasto o movimiento.</div>
  </div>
  <div class="chat-input-area">
    <input type="text" id="inputMessage" placeholder="Ej: Compré 2 cafés a 3000 con Galicia..." autofocus autocomplete="off" />
    <button id="sendBtn">Enviar</button>
  </div>
</div>

<!-- Modal de Configuración de Múltiples Sesiones -->
<div id="modal-config" class="modal-overlay">
  <div class="modal-card">
    <h3 class="modal-title">⚙️ Configuración de Sesiones</h3>

    <!-- Selector de Perfil -->
    <label class="field-label">Perfil Seleccionado:</label>
    <div class="profile-row">
      <select id="cfg-profile-select" class="profile-select">
      </select>
      <button id="btn-profile-new" class="button-primary">+ Nuevo</button>
    </div>

    <!-- Nombre del Perfil -->
    <label class="field-label">Nombre del Perfil:</label>
    <input type="text" id="cfg-profile-name" placeholder="Ej: Personal, Trabajo..." class="field-input">

    <!-- URL de Firefly III -->
    <label class="field-label">URL de Firefly III:</label>
    <input type="text" id="cfg-firefly-url" placeholder="http://app:8080" class="field-input">

    <!-- Token de Firefly III -->
    <label class="field-label">Token de Firefly III:</label>
    <input type="password" id="cfg-firefly-token" placeholder="Bearer Token..." class="field-input">

    <!-- API Key de Groq -->
    <label class="field-label">API Key de Groq:</label>
    <input type="password" id="cfg-groq-key" placeholder="gsk_..." class="field-input">

    <!-- Botones de Acción -->
    <div class="button-actions">
      <button id="btn-config-save" class="button-confirm">Guardar y Usar</button>
      <button id="btn-config-cancel" class="button-cancel">Cancelar</button>
    </div>

    <button id="btn-profile-delete" class="button-danger">
      🗑️ Eliminar este perfil
    </button>
  </div>
</div>

<script type="module" src="/js/app.js"></script>

</body>
</html>
