<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firefly AI Assistant (Full Auto)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; height: 100vh; }
    .chat-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; background-color: #1e293b; border-left: 1px solid #334155; border-right: 1px solid #334155; }
    .chat-header { padding: 16px; background-color: #0f172a; border-bottom: 1px solid #334155; text-align: center; }
    .chat-header h1 { font-size: 18px; color: #38bdf8; }
    .chat-header p { font-size: 11px; color: #94a3b8; margin-top: 4px; }
    .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
    .message.user { align-self: flex-end; background-color: #2563eb; color: #ffffff; border-bottom-right-radius: 2px; }
    .message.bot { align-self: flex-start; background-color: #334155; color: #f8fafc; border-bottom-left-radius: 2px; }
    .message.error { background-color: #7f1d1d; color: #fecaca; }
    .chat-input-area { padding: 12px; background-color: #0f172a; border-top: 1px solid #334155; display: flex; gap: 8px; }
    input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background-color: #1e293b; color: #fff; font-size: 14px; outline: none; }
    input[type="text"]:focus { border-color: #38bdf8; }
    button { padding: 12px 18px; border-radius: 8px; border: none; background-color: #2563eb; color: white; font-weight: bold; cursor: pointer; }
    button:disabled { background-color: #475569; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <h1>Firefly AI Assistant</h1>
    <p id="status-text">Cargando datos de Firefly III...</p>
    <button id="btn-config" onclick="abrirModalConfig()" style="background:none; border:none; color:white; font-size:1.2rem; cursor:pointer;">⚙️</button>
  </div>
  <div class="chat-messages" id="chat">
    <div class="message bot">¡Hola! Sincronicé tus cuentas, categorías y etiquetas. Decime tu gasto o movimiento.</div>
  </div>
  <div class="chat-input-area">
    <input type="text" id="inputMessage" placeholder="Ej: Compré 2 cafés a 3000 con Galicia..." autofocus autocomplete="off" />
    <button id="sendBtn" onclick="enviarMensaje()">Enviar</button>
  </div>
</div>

<!-- Modal de Configuración de Múltiples Sesiones -->
<div id="modal-config" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); align-items:center; justify-content:center; z-index:1000;">
  <div style="background:#1e293b; color:#f8fafc; padding:20px; border-radius:12px; width:90%; max-width:400px; box-shadow:0 10px 25px rgba(0,0,0,0.5);">
    <h3 style="margin-top:0;">⚙️ Configuración de Sesiones</h3>
    
    <!-- Selector de Perfil -->
    <label style="display:block; margin-top:10px; font-size:0.85rem; color:#94a3b8;">Perfil Seleccionado:</label>
    <div style="display:flex; gap:8px; margin-top:4px;">
      <select id="cfg-profile-select" onchange="cambiarPerfilFormulario()" style="flex:1; padding:8px; border-radius:6px; border:1px solid #334155; background:#0f172a; color:white;">
      </select>
      <button onclick="crearNuevoPerfil()" style="background:#3b82f6; color:white; border:none; padding:8px 12px; border-radius:6px; cursor:pointer;">+ Nuevo</button>
    </div>

    <!-- Nombre del Perfil -->
    <label style="display:block; margin-top:10px; font-size:0.85rem; color:#94a3b8;">Nombre del Perfil:</label>
    <input type="text" id="cfg-profile-name" placeholder="Ej: Personal, Trabajo..." style="width:100%; padding:8px; margin-top:4px; border-radius:6px; border:1px solid #334155; background:#0f172a; color:white; box-sizing:border-box;">

    <!-- URL de Firefly III -->
    <label style="display:block; margin-top:10px; font-size:0.85rem; color:#94a3b8;">URL de Firefly III:</label>
    <input type="text" id="cfg-firefly-url" placeholder="http://app:8080" style="width:100%; padding:8px; margin-top:4px; border-radius:6px; border:1px solid #334155; background:#0f172a; color:white; box-sizing:border-box;">
    
    <!-- Token de Firefly III -->
    <label style="display:block; margin-top:10px; font-size:0.85rem; color:#94a3b8;">Token de Firefly III:</label>
    <input type="password" id="cfg-firefly-token" placeholder="Bearer Token..." style="width:100%; padding:8px; margin-top:4px; border-radius:6px; border:1px solid #334155; background:#0f172a; color:white; box-sizing:border-box;">
    
    <!-- API Key de Groq -->
    <label style="display:block; margin-top:10px; font-size:0.85rem; color:#94a3b8;">API Key de Groq:</label>
    <input type="password" id="cfg-groq-key" placeholder="gsk_..." style="width:100%; padding:8px; margin-top:4px; border-radius:6px; border:1px solid #334155; background:#0f172a; color:white; box-sizing:border-box;">
    
    <!-- Botones de Acción -->
    <div style="display:flex; justify-content:space-between; margin-top:20px; gap:10px;">
      <button onclick="guardarConfiguracion()" style="flex:1; background:#22c55e; color:white; border:none; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer;">Guardar y Usar</button>
      <button onclick="cerrarModalConfig()" style="flex:1; background:#475569; color:white; border:none; padding:10px; border-radius:6px; cursor:pointer;">Cancelar</button>
    </div>

    <button onclick="eliminarPerfilActual()" style="width:100%; margin-top:12px; background:#ef4444; color:white; border:none; padding:8px; border-radius:6px; font-size:0.85rem; cursor:pointer;">
      🗑️ Eliminar este perfil
    </button>
  </div>
</div>

<script>

  let assetAccounts = [];
  let revenueAccounts = [];
  let existingTags = [];
  let existingCategories = [];
  let defaultAssetAccount = "";
  let transaccionPendiente = null;

  const chat = document.getElementById("chat");
  const inputMessage = document.getElementById("inputMessage");
  const statusText = document.getElementById("status-text");
  const sendBtn = document.getElementById("sendBtn");

  // Estructura usada cuando no hay nada guardado o lo guardado es inservible
  function estadoPerfilesInicial() {
    return {
      activeProfileId: "default",
      profiles: {
        "default": { name: "Personal", fireflyUrl: "", fireflyToken: "", groqKey: "" }
      }
    };
  }

  // Cargar perfiles almacenados. Un valor corrompido no puede dejar la app inusable.
  function getProfilesState() {
    const data = localStorage.getItem("firefly_profiles_cfg");
    if (!data) return estadoPerfilesInicial();

    try {
      const state = JSON.parse(data);
      const esValido = state && typeof state === "object"
        && state.profiles && typeof state.profiles === "object"
        && Object.keys(state.profiles).length > 0;

      if (!esValido) throw new Error("Estructura de perfiles inválida");

      // El perfil activo pudo haber sido eliminado en otra pestaña
      if (!state.profiles[state.activeProfileId]) {
        state.activeProfileId = Object.keys(state.profiles)[0];
      }
      return state;
    } catch (err) {
      console.warn("Configuracion de perfiles ilegible, se reinicia:", err);
      return estadoPerfilesInicial();
    }
  }

  // Guardar estado completo de perfiles
  function saveProfilesState(state) {
    localStorage.setItem("firefly_profiles_cfg", JSON.stringify(state));
  }



    // Obtener el perfil activo actual para hacer peticiones fetch
  function getAuthHeaders() {
    const state = getProfilesState();
    const active = state.profiles[state.activeProfileId] || {};
    return {
      "Content-Type": "application/json",
      "x-firefly-url": active.fireflyUrl || "",
      "x-firefly-token": active.fireflyToken || "",
      "x-groq-key": active.groqKey || ""
    };
  }

  inputMessage.addEventListener("keypress", (e) => {
    if (e.key === "Enter") enviarMensaje();
  });

  // Trae todas las páginas de un endpoint. Firefly III devuelve 50 elementos
  // por página, así que sin esto el modelo no veía el resto de los datos.
  async function fetchTodasLasPaginas(ruta) {
    const items = [];
    const maxPaginas = 20;
    let pagina = 1;
    let totalPaginas = 1;

    do {
      const separador = ruta.includes("?") ? "&" : "?";
      const res = await fetch(`${ruta}${separador}limit=100&page=${pagina}`, { headers: getAuthHeaders() });
      if (!res.ok) throw new Error(`Error consultando ${ruta} (HTTP ${res.status}).`);

      const json = await res.json();
      items.push(...(json.data || []));

      const paginacion = json.meta && json.meta.pagination;
      totalPaginas = (paginacion && paginacion.total_pages) || 1;
      pagina++;
    } while (pagina <= totalPaginas && pagina <= maxPaginas);

    return items;
  }

  // Cargar Cuentas, Tags y Categorías dinámicamente desde Firefly III
  async function cargarDatosFirefly() {
    try {
      const [asset, revenue, tags, categories] = await Promise.all([
        fetchTodasLasPaginas("/api/firefly/accounts?type=asset"),
        fetchTodasLasPaginas("/api/firefly/accounts?type=revenue"),
        fetchTodasLasPaginas("/api/firefly/tags"),
        fetchTodasLasPaginas("/api/firefly/categories")
      ]);

      assetAccounts = asset.map(a => a.attributes.name);
      revenueAccounts = revenue.map(a => a.attributes.name);
      existingTags = tags.map(t => t.attributes.tag);
      existingCategories = categories.map(c => c.attributes.name);

      if (assetAccounts.length > 0) defaultAssetAccount = assetAccounts[0];

      statusText.innerText = `Sincronizado (${assetAccounts.length} cuentas / ${existingCategories.length} cat / ${existingTags.length} tags)`;
      statusText.style.color = "#4ade80";
    } catch (err) {
      console.error(err);

      // Sin URL ni token el fallo es esperable: guiar en vez de mostrar un error
      const activo = getProfilesState().profiles[getProfilesState().activeProfileId] || {};
      if (!activo.fireflyUrl || !activo.fireflyToken) {
        statusText.innerText = "Configurá tu Firefly III para empezar";
        statusText.style.color = "#facc15";
        agregarMensaje("Todavía no hay un perfil configurado. Abrí ⚙️ y cargá la URL y el token de Firefly III.", "bot");
        abrirModalConfig();
        return;
      }

      statusText.innerText = "❌ Error al sincronizar datos.";
      statusText.style.color = "#f87171";
    }
  }

  // Escapar lo que venga de Groq o de Firefly III antes de insertarlo como HTML
  function escaparHtml(valor) {
    const div = document.createElement("div");
    div.textContent = valor === null || valor === undefined ? "" : String(valor);
    return div.innerHTML;
  }

  // esHtml solo puede ser true para marcado que construye la app, nunca para
  // texto del usuario ni del modelo.
  function agregarMensaje(texto, tipo = "bot", esHtml = false) {
    const msg = document.createElement("div");
    msg.className = `message ${tipo}`;
    if (esHtml) {
      msg.innerHTML = texto;
    } else {
      msg.textContent = texto;
    }
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
  }

    // 1. Enviar mensaje delegando a procesarMensajeUsuario
  async function enviarMensaje() {
    const texto = inputMessage.value.trim();
    if (!texto) return;

    agregarMensaje(texto, "user");
    inputMessage.value = "";
    sendBtn.disabled = true;

    try {
      await procesarMensajeUsuario(texto);
    } catch (err) {
      agregarMensaje(`❌ Error: ${err.message}`, "bot error");
    } finally {
      sendBtn.disabled = false;
    }
  }
  // Funciones auxiliares para detectar confirmación o cancelación del usuario
  function esRespuestaAfirmativa(texto) {
    const afirmativas = ["si", "sí", "correcto", "dale", "ok", "confirmar", "s", "confirmo", "ya", "claro", "de una"];
    return afirmativas.includes(texto.trim().toLowerCase());
  }

  function esRespuestaNegativa(texto) {
    const negativas = ["no", "cancelar", "incorrecto", "n", "pará", "espera", "cancela"];
    return negativas.includes(texto.trim().toLowerCase());
  }
  // 2. Flujo principal con estado de confirmación
  async function procesarMensajeUsuario(mensajeTexto) {
    // A. Respuesta afirmativa a una confirmación previa
    if (transaccionPendiente && esRespuestaAfirmativa(mensajeTexto)) {
      agregarMensaje("⏳ Registrando transacción en Firefly III...", "bot");
      const resultado = await crearTransaccionFirefly(transaccionPendiente);
      agregarMensaje(resultado, "bot", true);
      transaccionPendiente = null;
      return;
    }

    // B. Respuesta negativa / cancelación
    if (transaccionPendiente && esRespuestaNegativa(mensajeTexto)) {
      transaccionPendiente = null;
      agregarMensaje("🚫 Operación cancelada. Podés indicarme la corrección.", "bot");
      return;
    }

    // C. Consulta a Groq
    const interpretacion = await consultarGroq(mensajeTexto);

    // D. Evaluar confirmación o ejecución según la respuesta del modelo
    if (interpretacion.requiere_confirmacion) {
      transaccionPendiente = interpretacion; // Guarda los datos planos devueltos por Groq
      agregarMensaje(interpretacion.mensaje_confirmacion, "bot");
    } else if (interpretacion.type === "query") {
      const respuestaConsulta = await procesarConsultaFirefly(interpretacion);
      agregarMensaje(respuestaConsulta, "bot", true);
    } else {
      const resultado = await crearTransaccionFirefly(interpretacion);
      agregarMensaje(resultado, "bot", true);
    }
  }

  async function consultarGroq(promptUsuario) {
    // Obtener fecha actual en formato ISO (YYYY-MM-DD)
    const hoyStr = new Date().toLocaleDateString("sv-SE"); // "sv-SE" devuelve el formato ISO AAAA-MM-DD
    const systemPrompt = `Sos un asistente financiero que parsea lenguaje natural a un JSON estricto para la API de Firefly III.
    La fecha de hoy es: ${hoyStr}

    Cuentas de Activo disponibles:
    ${JSON.stringify(assetAccounts)}

    Cuentas de Ingreso disponibles:
    ${JSON.stringify(revenueAccounts)}

    Categorías existentes en Firefly III:
    ${JSON.stringify(existingCategories)}

    Etiquetas (tags) existentes en Firefly III:
    ${JSON.stringify(existingTags)}

    Cuenta de activo por defecto: "${defaultAssetAccount}"

    Devolverás ÚNICAMENTE un objeto JSON válido con este formato:
    {
        "type": "withdrawal" | "deposit" | "transfer" | "query",
        "requiere_confirmacion": boolean,
        "mensaje_confirmacion": string,
        "query_type": "balance" | "budget" | "recent_transactions" | null,
        "amount": number,
        "description": string,
        "source_name": string,
        "destination_name": string,
        "category_name": string,
        "installments": number,
        "tags": string[],
        "date": "YYYY-MM-DD"
    }
    
    REGLAS OBLIGATORIAS DE CONFIRMACIÓN (LEER CON ATENCIÓN):
    1. SIEMPRE debes establecer "requiere_confirmacion": true para CUALQUIER registro de transacción (gasto, ingreso o transferencia), A MENOS que el usuario explícitamente diga palabras como "registra directamente", "sin confirmar" o "confirmado".
    2. Cuando "requiere_confirmacion" sea true:
       - Genera todos los campos de la transacción normalmente ("amount", "description", "source_name", etc.).
       - Escribe un "mensaje_confirmacion" claro en lenguaje natural pidiendo validación. Ejemplo:
         "¿Confirmás el gasto de $15.000 en 'Supermercado' usando la cuenta 'Galicia' bajo la categoría 'Comida'?"
    3. Para consultas de saldo/movimientos ("type": "query"), SIEMPRE establece "requiere_confirmacion": false y "mensaje_confirmacion": "".

    REGLAS PARA CONSULTAS Y CONSULTAS DE SALDO:
    1. Si el usuario está HACIENDO UNA PREGUNTA o pidiendo información (no registrando un gasto/ingreso), marcá "type": "query".
    2. "query_type":
    - "balance": Si pregunta por saldos ("¿Cuánto me queda?", "Saldo de Galicia", "Saldos actuales").
    - "budget": Si pregunta por presupuestos ("¿Cuánto me queda en comida?", "Estado de presupuestos").
    - "recent_transactions": Si pide ver sus últimos movimientos ("¿Cuáles fueron mis últimos gastos?").
    - Si "query_type" es "balance" o "budget" y menciona una cuenta o categoría específica, asignala a "source_name" o "category_name".

    REGLAS DE MAPPING:
    1. "category_name": Asigná la categoría que mejor describa el gasto.
    - Priorizá siempre reutilizar una de la lista de "Categorías existentes".
    - Si ninguna encaja adecuadamente, podés crear un nombre de categoría nuevo corto en formato Title Case (ej: "Restaurantes", "Mascotas", "Tecnología").
    - Para las transferencias internas ("transfer"), podés devolver un string vacío "".
    2. "tags": Analizá la intención del gasto y asigná entre 1 y 3 etiquetas relevantes.
    - Priorizá siempre reutilizar etiquetas del listado de "Etiquetas existentes".
    - Si ninguna etiqueta existente encaja, podés crear una nueva etiqueta limpia (en minúsculas, palabras simples sin espacios, ej: "cafeteria", "supermercado", "transporte", "salida").
    - Si el usuario pone un hashtag explícito en el texto (ej: #salidas), incluyo esa etiqueta.
    3. "withdrawal":
    - source_name: Nombre exacto de la cuenta de activo. Si no menciona ninguna, usá "${defaultAssetAccount}".
    - destination_name: El comercio o concepto del gasto.
    4. "deposit":
    - source_name: Fuente de ingreso (ej: "Sueldo").
    - destination_name: Cuenta de activo donde entra el dinero.
    5. "transfer":
    - Movimiento entre dos cuentas de activo propias.
    6. "installments": Cantidad de cuotas (1 por defecto).
    7. Compras en Cuotas o Tarjeta de Crédito:
    - Si el gasto menciona "cuotas" (o "installments > 1") o nombra una tarjeta de crédito (ej: "Visa", "Mastercard", "Tarjeta", "Galicia crédito"), seleccioná la cuenta de tarjeta correspondiente de la lista de "Cuentas de Activo".
    - Si no se especifica el nombre de la tarjeta pero hay cuotas, busca una cuenta de activo que contenga la palabra "Tarjeta" o "Crédito".
    8. "date":
    - Si el usuario no menciona ninguna fecha, usá la fecha de hoy ("${hoyStr}").
    - Si menciona fechas relativas (ej: "ayer", "hace 3 días", "el lunes pasado", "el 15 de este mes"), calculá y devolvé la fecha exacta en formato "YYYY-MM-DD" tomando como referencia que hoy es ${hoyStr}.`;

    // Últimos mensajes del chat como contexto. Se excluye el último elemento:
    // enviarMensaje() ya lo agregó al DOM y se envía aparte como promptUsuario.
    const historial = Array.from(chat.querySelectorAll(".message")).slice(-5, -1).map(msg => ({
      role: msg.classList.contains("user") ? "user" : "assistant",
      content: msg.textContent
    }));

    const res = await fetch("/api/groq", {
        method: "POST",
        headers: getAuthHeaders(),
        body: JSON.stringify({
        model: "openai/gpt-oss-120b",
        messages: [
            { role: "system", content: systemPrompt },
            ...historial,
            { role: "user", content: promptUsuario }
        ],
        response_format: { type: "json_object" },
        temperature: 0.1
        })
    });

    if (!res.ok) {
        const errData = await res.json();
        throw new Error(`Groq API Error: ${errData.error?.message || res.statusText}`);
    }

    const data = await res.json();
    return JSON.parse(data.choices[0].message.content);
  }

  async function crearTransaccionFirefly(data) {
    const transacciones = [];
    const numCuotas = data.installments || 1;

    // Repartir en centavos: dividir y redondear cada cuota perdia plata
    // (10000 en 3 cuotas facturaba 9999.99). El sobrante va a las primeras.
    const totalCentavos = Math.round(Number(data.amount) * 100);
    const centavosBase = Math.floor(totalCentavos / numCuotas);
    const centavosSobrantes = totalCentavos - centavosBase * numCuotas;
    // Parsear la fecha devuelta por Groq o usar la fecha actual como fallback
    const [year, month, day] = data.date 
    ? data.date.split("-").map(Number) 
    : [new Date().getFullYear(), new Date().getMonth() + 1, new Date().getDate()];

    for (let i = 0; i < numCuotas; i++) {
        // Fecha de la cuota i. El dia se recorta al ultimo del mes destino,
        // porque new Date(2026, 0 + 1, 31) desbordaria al 3 de marzo.
        const diasDelMes = new Date(year, month + i, 0).getDate();
        const fechaCuota = new Date(year, month - 1 + i, Math.min(day, diasDelMes));

        // Formatear a YYYY-MM-DD sin desfase UTC
        const fechaISO = fechaCuota.toLocaleDateString("sv-SE");

        const centavosCuota = centavosBase + (i < centavosSobrantes ? 1 : 0);
        const montoCuota = (centavosCuota / 100).toFixed(2);

        transacciones.push({
            type: data.type,
            date: fechaISO, // <--- Fecha exacta en UTC-3
            amount: montoCuota,
            description: numCuotas > 1 ? `${data.description} (Cuota ${i + 1}/${numCuotas})` : data.description,
            source_name: data.source_name,
            destination_name: data.destination_name,
            category_name: data.category_name || null,
            tags: data.tags || []
        });
    }

    const payload = { transactions: transacciones };
    if (numCuotas > 1) {
      payload.group_title = `${data.description} (${numCuotas} cuotas)`;
    }

    const res = await fetch("/api/firefly/transactions", {
        method: "POST",
        headers: getAuthHeaders(),
        body: JSON.stringify(payload)
    });

    if (!res.ok) {
        const errorData = await res.json();
        throw new Error(errorData.message || "Error al registrar en Firefly III.");
    }

    const metaInfo = [];
    if (data.category_name) metaInfo.push(`📁 Categoría: <b>${escaparHtml(data.category_name)}</b>`);
    if (data.tags && data.tags.length > 0) metaInfo.push(`🏷️ Tags: ${data.tags.map(t => `#${escaparHtml(t)}`).join(", ")}`);
    
    const extraHtml = metaInfo.length > 0 ? `<br><small>${metaInfo.join(" | ")}</small>` : "";

    if (data.type === "transfer") {
      return `✅ Transferencia de <b>$${escaparHtml(data.amount)}</b> de <i>${escaparHtml(data.source_name)}</i> a <i>${escaparHtml(data.destination_name)}</i>.${extraHtml}`;
    }

    return numCuotas > 1
      ? `✅ Registradas <b>${numCuotas} cuotas</b> de ${transacciones[0].amount} en <i>${escaparHtml(data.source_name)}</i> para "${escaparHtml(data.description)}".${extraHtml}`
      : `✅ Registrado gasto de <b>$${escaparHtml(data.amount)}</b> en <i>${escaparHtml(data.source_name)}</i> para "${escaparHtml(data.description)}".${extraHtml}`;
  }

  async function procesarConsultaFirefly(data) {
    // A. Consulta de Saldos
    if (data.query_type === "balance") {
        const res = await fetch("/api/firefly/accounts?type=asset",{headers: getAuthHeaders()});
        if (!res.ok) throw new Error("No se pudieron consultar las cuentas.");
        
        const json = await res.json();
        let cuentas = json.data.map(a => ({
        nombre: a.attributes.name,
        saldo: parseFloat(a.attributes.current_balance),
        moneda: a.attributes.currency_symbol || "$"
        }));

        // Si filtró por una cuenta en particular
        if (data.source_name) {
        cuentas = cuentas.filter(c => c.nombre.toLowerCase().includes(data.source_name.toLowerCase()));
        }

        if (cuentas.length === 0) return "📉 No encontré información para esa cuenta.";

        let html = "<b>💳 Saldos actuales:</b><br>";
        cuentas.forEach(c => {
        html += `• <b>${escaparHtml(c.nombre)}:</b> ${escaparHtml(c.moneda)}${c.saldo.toLocaleString("es-AR", { minimumFractionDigits: 2 })}<br>`;
        });
        return html;
    }

    // B. Consulta de Presupuestos
    if (data.query_type === "budget") {
        // Firefly solo devuelve "spent" cuando se acota el rango de fechas
        const ahora = new Date();
        const inicioMes = new Date(ahora.getFullYear(), ahora.getMonth(), 1).toLocaleDateString("sv-SE");
        const finMes = new Date(ahora.getFullYear(), ahora.getMonth() + 1, 0).toLocaleDateString("sv-SE");
        const res = await fetch(`/api/firefly/budgets?start=${inicioMes}&end=${finMes}`, { headers: getAuthHeaders() });
        if (!res.ok) throw new Error("No se pudieron consultar los presupuestos.");

        const json = await res.json();
        if (json.data.length === 0) return "📊 No tenés presupuestos activos configurados.";

        let html = "<b>📊 Estado de Presupuestos:</b><br>";
        json.data.forEach(b => {
        const attr = b.attributes;
        // Extraer datos asignados y gastados del objeto
        const gastado = attr.spent ? Math.abs(parseFloat(attr.spent[0]?.sum || 0)) : 0;
        html += `• <b>${escaparHtml(attr.name)}:</b> Gastado $${gastado.toLocaleString("es-AR")}<br>`;
        });
        return html;
    }

   // C. Últimas Transacciones (Filtrando directamente por API)
    if (data.query_type === "recent_transactions") {
    const hoyISO = new Date().toLocaleDateString("sv-SE");

    // Consultamos pidiendo orden por fecha descendente y limitando la fecha final a hoy (end=hoyISO)
    const url = `/api/firefly/transactions?limit=10&page=1&order=date&dir=desc&end=${hoyISO}`;

    const res = await fetch(url, { headers: getAuthHeaders() });
    if (!res.ok) throw new Error("No se pudieron consultar las últimas transacciones.");

    const json = await res.json();
    if (!json.data || json.data.length === 0) return "📑 No hay transacciones registradas hasta la fecha.";

    // Extraer las transacciones internas
    const ultimasTransacciones = [];
    json.data.forEach(group => {
        if (group.attributes && group.attributes.transactions) {
        group.attributes.transactions.forEach(tx => {
            ultimasTransacciones.push(tx);
        });
        }
    });

    // Tomamos las primeras 5
    const seleccionadas = ultimasTransacciones.slice(0, 5);

    if (seleccionadas.length === 0) return "📑 No hay transacciones pasadas registradas.";

    let html = "<b>📜 Últimos movimientos reales:</b><br>";
    seleccionadas.forEach(tx => {
        const signo = tx.type === "withdrawal" ? "-" : "+";
        const monto = parseFloat(tx.amount).toLocaleString("es-AR", { minimumFractionDigits: 2 });
        const fecha = tx.date ? tx.date.split("T")[0] : "";
        
        html += `• <i>${escaparHtml(fecha)}</i> | <b>${escaparHtml(tx.description)}</b>: ${signo}$${monto} (${escaparHtml(tx.source_name)})<br>`;
    });
    
    return html;
    }

    return "❓ No pude interpretar qué consulta querés realizar.";
    }

  function abrirModalConfig() {
    document.getElementById("modal-config").style.display = "flex";
    renderProfileSelector();
  }

  function renderProfileSelector() {
    const state = getProfilesState();
    const select = document.getElementById("cfg-profile-select");
    select.innerHTML = "";

    Object.keys(state.profiles).forEach(id => {
      const opt = document.createElement("option");
      opt.value = id;
      opt.textContent = state.profiles[id].name || id;
      if (id === state.activeProfileId) opt.selected = true;
      select.appendChild(opt);
    });

    cambiarPerfilFormulario();
  }

  // Cargar en el formulario los inputs del perfil seleccionado en el dropdown
  function cambiarPerfilFormulario() {
    const state = getProfilesState();
    const selectedId = document.getElementById("cfg-profile-select").value;
    const p = state.profiles[selectedId] || {};

    document.getElementById("cfg-profile-name").value = p.name || "";
    document.getElementById("cfg-firefly-url").value = p.fireflyUrl || "";
    document.getElementById("cfg-firefly-token").value = p.fireflyToken || "";
    document.getElementById("cfg-groq-key").value = p.groqKey || "";
  }

  // Guardar o Actualizar Perfil
  function guardarConfiguracion() {
    const state = getProfilesState();
    const selectedId = document.getElementById("cfg-profile-select").value || "profile_" + Date.now();

    const name = document.getElementById("cfg-profile-name").value.trim() || "Sin nombre";
    const fireflyUrl = document.getElementById("cfg-firefly-url").value.trim();
    const fireflyToken = document.getElementById("cfg-firefly-token").value.trim();
    const groqKey = document.getElementById("cfg-groq-key").value.trim();

    // Actualizar datos del perfil
    state.profiles[selectedId] = { name, fireflyUrl, fireflyToken, groqKey };
    state.activeProfileId = selectedId; // Marcarlo como activo

    saveProfilesState(state);

    cerrarModalConfig();
    alert(`✅ Perfil "${name}" activado y guardado.`);

    // Recargar cuentas/datos con el nuevo token seleccionado
    if (typeof cargarDatosFirefly === "function") {
      cargarDatosFirefly();
    }
  }

  // Crear nuevo borrador de perfil
  function crearNuevoPerfil() {
    const newId = "profile_" + Date.now();
    const select = document.getElementById("cfg-profile-select");
    
    const opt = document.createElement("option");
    opt.value = newId;
    opt.textContent = "Nuevo Perfil";
    opt.selected = true;
    select.appendChild(opt);

    document.getElementById("cfg-profile-name").value = "Nuevo Perfil";
    document.getElementById("cfg-firefly-url").value = "";
    document.getElementById("cfg-firefly-token").value = "";
    document.getElementById("cfg-groq-key").value = "";
  }

  // Eliminar el perfil actualmente seleccionado
  function eliminarPerfilActual() {
    const state = getProfilesState();
    const selectedId = document.getElementById("cfg-profile-select").value;

    if (Object.keys(state.profiles).length <= 1) {
      alert("❌ Debe existir al menos un perfil.");
      return;
    }

    if (confirm(`¿Seguro que querés eliminar el perfil "${state.profiles[selectedId].name}"?`)) {
      delete state.profiles[selectedId];
      state.activeProfileId = Object.keys(state.profiles)[0]; // Asignar el primero restante como activo
      saveProfilesState(state);
      renderProfileSelector();
      alert("🗑️ Perfil eliminado.");
    }
  }

  function cerrarModalConfig() {
    document.getElementById("modal-config").style.display = "none";
  }
  // Inicializar al cargar la página
  cargarDatosFirefly();
</script>
